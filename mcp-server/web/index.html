<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信历史 MCP · 服务管理</title><link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
  <main>
    <header><div class="brand"><img class="mark" src="/icon.svg" width="44" height="44" alt=""><div><strong>微信历史 MCP</strong><span class="local">本机服务管理</span></div></div><span class="privacy"><i></i>仅本机访问</span></header>
    <section class="hero">
      <div><p class="eyebrow">服务概览</p><h1>微信历史，随时可用。</h1><p class="subtitle">让 ChatGPT 只读访问你的微信历史。</p></div>
      <div class="service"><span id="status" class="badge">正在连接管理后台</span><p id="summary">正在读取本机服务状态…</p><div class="actions"><button data-action="start" id="start" class="primary">启动服务</button><button data-action="restart" id="restart">重启</button><button data-action="stop" id="stop">停止</button></div></div>
    </section>
    <div id="error" role="alert" hidden></div>
    <section class="cards" aria-label="服务状态">
      <article class="card"><div class="card-top"><span class="icon" aria-hidden="true">↔</span><h2>微信历史 MCP</h2></div><strong id="mcp" class="value">—</strong><p>查找会话、读取和翻页微信历史</p><div class="card-foot">只读服务</div></article>
      <article class="card"><div class="card-top"><span class="icon" aria-hidden="true">⌁</span><h2>私有隧道</h2></div><strong id="tunnel" class="value">—</strong><p>连接你的个人 ChatGPT 工作区</p><div class="card-foot"><a id="diagnostics" target="_blank" rel="noopener noreferrer" hidden>打开隧道诊断 ↗</a><span id="diagnostics-empty">服务启动后可查看诊断</span></div></article>
    </section>
    <section class="logs-section"><div class="section-heading"><div><h2>最近诊断</h2><p>最多显示 100 条记录，不含密钥或聊天正文。</p></div><span id="refreshed">每 2 秒更新</span></div><div class="logs" id="logs" aria-label="诊断日志"><p class="empty">暂无诊断记录</p></div></section>
    <footer><span>关闭浏览器后，服务继续在后台运行。</span><span>微信历史 MCP</span></footer>
  </main>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微信回复教练</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#17212b;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}header{padding:18px 20px;background:white;border-bottom:1px solid #e5e8eb;font-weight:650}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #e5e8eb;border-radius:14px;padding:16px;margin-bottom:14px}input,button{font:inherit;border-radius:9px;padding:10px 12px}input{border:1px solid #ced4da;width:100%}button{border:0;background:#2469e8;color:white;cursor:pointer}button:disabled{opacity:.5}#sessions button{display:block;width:100%;text-align:left;background:#f2f5fa;color:#17212b;margin:6px 0}.bubble{max-width:85%;padding:10px 12px;border-radius:12px;margin:9px 0;background:#f0f2f4;white-space:pre-wrap;overflow-wrap:anywhere}.self{margin-left:auto;background:#dceafe}.small{color:#687580;font-size:13px}.hidden{display:none}.actions{display:flex;gap:10px}.actions button{flex:1}#reply{font-size:17px;white-space:pre-wrap}#reason{margin-top:8px;color:#687580}
  </style>
</head>
<body>
  <header>微信回复教练</header>
  <main>
    <section class="card" id="list"><div class="actions"><b>会话</b><button id="refresh">刷新会话</button></div><div id="sessions">加载中…</div></section>
    <section class="card hidden" id="chat"><div class="actions"><button id="back">返回会话</button><button id="more">更早消息</button></div><h3 id="title"></h3><div id="messages"></div><button id="suggest">生成回复建议</button></section>
    <section class="card hidden" id="suggestion"><b>建议回复</b><p id="reply"></p><div id="reason"></div><p class="small">建议不会保存；请自行判断是否发送。</p></section>
    <p id="error" class="small" role="alert"></p>
  </main>
  <script>
    let current='',cursor=null;
    const $=id=>document.getElementById(id);
    const show=(id,on)=>$(id).classList.toggle('hidden',!on);
    async function api(path,options={}){const response=await fetch('/wechat-coach/api'+path,{...options,headers:{'content-type':'application/json'}});if(response.status===401){location.reload();throw new Error('请重新登录 DSH Pocket')}const result=await response.json();if(!response.ok)throw new Error(result.error||'请求失败');return result}
    function error(e){$('error').textContent=e.message||String(e)}
    async function loadSessions(){const data=await api('/sessions');$('sessions').replaceChildren();for(const session of data.sessions){const button=document.createElement('button');button.textContent=session.name;button.onclick=()=>open(session);$('sessions').append(button)}if(!data.sessions.length)$('sessions').textContent='还没有同步到会话';$('error').textContent=''}
    $('refresh').onclick=()=>loadSessions().catch(error);
    async function open(session){current=session.id;cursor=null;show('list',false);show('chat',true);show('suggestion',false);$('title').textContent=session.name;$('messages').replaceChildren();await load().catch(error)}
    async function load(){const query=cursor?'?before='+encodeURIComponent(cursor):'';const data=await api('/sessions/'+encodeURIComponent(current)+'/messages'+query);const fragment=document.createDocumentFragment();for(const message of data.messages){const bubble=document.createElement('div');bubble.className='bubble'+(message.isSelf?' self':'');bubble.textContent=message.content||'[非文本消息]';fragment.append(bubble)}$('messages').prepend(fragment);cursor=data.next;$('more').disabled=!cursor}
    $('more').onclick=()=>load().catch(error);
    $('back').onclick=()=>{show('chat',false);show('suggestion',false);show('list',true)};
    $('suggest').onclick=async()=>{const button=$('suggest');button.disabled=true;button.textContent='生成中…';show('suggestion',false);try{const result=await api('/sessions/'+encodeURIComponent(current)+'/suggest',{method:'POST',body:'{}'});$('reply').textContent=result.reply;$('reason').textContent=result.reason;show('suggestion',true);$('error').textContent=''}catch(e){error(e)}finally{button.disabled=false;button.textContent='重新生成'}};
    loadSessions().catch(error);
  </script>
</body>
</html>

name: Auto Tag

on:
  push:
    branches: [master]

jobs:
  tag:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Merge pull request #')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump
        id: bump
        run: |
          PR=$(echo "${{ github.event.head_commit.message }}" | grep -oP '#\K\d+' | head -1)

          if [ -z "$PR" ]; then
            echo "Not a merge commit, skipping"
            exit 0
          fi

          LABELS=$(gh pr view "$PR" --json labels --jq '.labels[].name' 2>/dev/null || echo "")

          if echo "$LABELS" | grep -q "^major$"; then
            BUMP="major"
          elif echo "$LABELS" | grep -q "^minor$"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          echo "PR: #$PR, bump: $BUMP"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LATEST" ]; then
            NEW="1.0.0"
            echo "No existing tag, starting at v$NEW"
            echo "tag=v$NEW" >> $GITHUB_OUTPUT
            echo "ver=$NEW" >> $GITHUB_OUTPUT
            exit 0
          fi

          VER="${LATEST#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)

          case "${{ steps.bump.outputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH + 1)) ;;
          esac

          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "Latest: $LATEST -> New: v$NEW"
          echo "tag=v$NEW" >> $GITHUB_OUTPUT
          echo "ver=$NEW" >> $GITHUB_OUTPUT

      - name: Sync pyproject.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.ver }}\"/" pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.ver }}" || echo "No changes to commit"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin master "${{ steps.version.outputs.tag }}"
          echo "✅ Tagged: ${{ steps.version.outputs.tag }} | synced pyproject.toml"

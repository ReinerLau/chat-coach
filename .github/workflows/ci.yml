name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  skill-selection:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate chat-reply selection
        run: |
          python3 skills/chat-reply/scripts/selection.py --check-catalog
          python3 -m unittest discover -s skills/chat-reply/tests

  mcp-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install MCP dependencies
        run: npm ci --prefix mcp-server

      - name: Run MCP tests
        run: npm test --prefix mcp-server

      - name: Verify standalone package
        run: npm run test:package --prefix mcp-server
